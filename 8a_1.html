
<html>
<head>
<title>Larger Number</title>
</head>
<body>
<script>
var a = parseInt(prompt("Enter first integer:"));
var b = parseInt(prompt("Enter second integer:"));
var c = parseInt(prompt("Enter third integer:"));

var larger = (a >= b && a >= c) ? a : (b >= a && b >= c) ? b : c;

if (a === b && b === c) {
    alert("EQUAL NUMBERS");
} else {
    alert(larger + " LARGER NUMBER");
}
</script>
</body>
</html>
