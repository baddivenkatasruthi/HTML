<html>
<body>
<script>
    document.write(Math.max(10,20,30)+"<br>");
    document.write(Math.min(10,20,30)+"<br>");
    document.write(Math.abs(-50)+"<br>");
    document.write(Math.pow(2,4)+"<br>");
    document.write(Math.sqrt(49)+"<br>");
    document.write(Math.floor(4.7)+"<br>");
    document.write(Math.ceil(4.2)+"<br>");
    document.write(Math.PI+"<br>");
    document.write(Math.E+"<br>");
    document.write(Math.round(4.5)+"<br>");
    document.write(Math.random()+"<br>");
    document.write(Math.trunc(4.9)+"<br>");
    document.write(Math.sign(-10)+"<br>");
    document.write(Math.cbrt(27)+"<br>");
    document.write(Math.exp(2)+"<br>");
    document.write(Math.log(10)+"<br>");
    document.write(Math.log10(100)+"<br>");
    document.write(Math.sin(Math.PI/2)+"<br>");
</script>
</body>
</html>
