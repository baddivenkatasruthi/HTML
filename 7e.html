<html>
<body>
<script>
    var str="Hello JavaScript";
    document.write(str.length+"<br>");
    document.write(str.charAt(6)+"<br>");
    document.write(str.charCodeAt(0)+"<br>");
    document.write(str.concat(" World")+"<br>");
    document.write(str.includes("Java")+"<br>");
    document.write(str.indexOf("a")+"<br>");
    document.write(str.lastIndexOf("a")+"<br>");
    document.write(str.slice(0,5)+"<br>");
    document.write(str.substring(6,10)+"<br>");
    document.write(str.substr(6,4)+"<br>");
    document.write(str.toUpperCase()+"<br>");
    document.write(str.toLowerCase()+"<br>");
    document.write(str.replace("JavaScript","World")+"<br>");
    document.write(str.split(" ")+"<br>");
    document.write(str.trim()+"<br>");
</script>
</body>
</html>
