<html>
<body>
<script>
    var a=[10,20,30,40,50];
    document.write(a+"<br>");
    document.write(a.length+"<br>");
    a.push(60);
    document.write(a+"<br>");
    a.pop();
    document.write(a+"<br>");
    a.shift();
    document.write(a+"<br>");
    a.unshift(5);
    document.write(a+"<br>");
    var b=a.concat([70,80]);
    document.write(b+"<br>");
    document.write(a.join("-")+"<br>");
    document.write(a.slice(1,3)+"<br>");
    a.splice(2,1,99);
    document.write(a+"<br>");
    document.write(a.indexOf(40)+"<br>");
    document.write(a.lastIndexOf(99)+"<br>");
    document.write(a.includes(20)+"<br>");
    a.forEach(function(x){ document.write(x+" "); });
    document.write("<br>");
    var c=a.map(function(x){ return x*2; });
    document.write(c+"<br>");
    var d=a.filter(function(x){ return x>20; });
    document.write(d+"<br>");
<!-- from 2nd word of functions names should have first letter capital-->
</script>
</body>
</html>
